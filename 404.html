<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>กำลังโหลด... — The Golden Hoard Novels</title>
<script>
  // [SPA-9] GitHub Pages Deep Link Trick
  // เมื่อ user เปิด URL เช่น /novels/abc123 ตรง
  // GitHub Pages จะ serve 404.html แทน
  // Script นี้จะ redirect กลับไป index.html พร้อมเก็บ path ไว้ใน ?_r=
  // [SPA-9 + HOTFIX-15] auto-detect BASE_PATH รองรับ GitHub Pages sub-folder
  (function() {
    var path   = window.location.pathname;
    var search = window.location.search;
    var hash   = window.location.hash;
    // หา base: ตัด trailing segment ออก เช่น /Novel/novels/abc → /Novel
    // แต่ถ้าเป็น /Novel/404.html → /Novel
    var segments = path.split('/').filter(Boolean); // ['Novel','novels','abc']
    // base คือ segment แรกเสมอ (repo folder ใน GitHub Pages)
    var base = segments.length > 0 ? '/' + segments[0] : '';
    // ตรวจ: ถ้า segment แรกดูเหมือน route (/novels, /library) ไม่ใช่ folder → ไม่มี base
    var knownRoutes = ['novels', 'library', 'favorites'];
    if (knownRoutes.indexOf(segments[0]) !== -1) base = '';
    // ป้องกัน loop: ถ้า search มี _r= อยู่แล้ว ให้ไป root แทน
    if (search.indexOf('_r=') !== -1) {
      window.location.replace(base + '/');
      return;
    }
    var redirectUrl = base + '/index.html?_r=' + encodeURIComponent(path + search + hash);
    window.location.replace(redirectUrl);
  })();
</script>
</head>
<body></body>
</html>
