          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <input class="np-volume" id="npVolume" type="range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
    </div>
  </div>
</div>

<audio id="audioEl"></audio>

<!-- ========== SLEEP TIMER POPUP ========== -->
<div id="sleepPopupOverlay" onclick="closeSleepPopup()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;"></div>
<div id="sleepPopup" style="display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1001;background:#1e1e1e;border-radius:18px;padding:28px 24px 20px;width:300px;max-width:90vw;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.6);">
  <div style="font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:20px;">ตั้งเวลาปิดเสียง</div>
  <div style="display:flex;align-items:center;justify-content:center;gap:24px;margin-bottom:18px;">
    <button onclick="adjustSleepMins(-5)" style="background:none;border:none;color:#aaa;font-size:1.6rem;cursor:pointer;padding:4px 12px;">−</button>
    <span id="sleepDisplay" style="font-size:2rem;font-weight:700;color:#fff;min-width:72px;">--:--</span>
    <button onclick="adjustSleepMins(5)"  style="background:none;border:none;color:#aaa;font-size:1.6rem;cursor:pointer;padding:4px 12px;">+</button>
  </div>
  <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;">
    <button class="sleep-preset" onclick="setSleepMins(15)"  style="background:#2a2a2a;border:1px solid #3a3a3a;color:#ccc;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:0.85rem;">15 นาที</button>
    <button class="sleep-preset" onclick="setSleepMins(30)"  style="background:#2a2a2a;border:1px solid #3a3a3a;color:#ccc;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:0.85rem;">30 นาที</button>
    <button class="sleep-preset" onclick="setSleepMins(60)"  style="background:#2a2a2a;border:1px solid #3a3a3a;color:#ccc;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:0.85rem;">1 ชม.</button>
    <button class="sleep-preset" onclick="setSleepMins(120)" style="background:#2a2a2a;border:1px solid #3a3a3a;color:#ccc;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:0.85rem;">2 ชม.</button>
  </div>
  <button id="sleepConfirmBtn" style="width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:#e8445a;color:#fff;font-size:0.95rem;cursor:pointer;">ยืนยัน</button>
  <button onclick="closeSleepPopup()" style="margin-top:10px;width:100%;padding:10px;border-radius:10px;border:none;background:none;color:#888;font-size:0.85rem;cursor:pointer;">ปิดตั้งเวลา</button>
</div>

<script>
/* toggleMobileNav — เปิด/ปิด mobile drawer */
function toggleMobileNav() {
  document.getElementById('mobileDrawer').classList.toggle('open');
}
/* ปิด drawer เมื่อคลิกนอก */
document.addEventListener('click', function(e) {
  const drawer = document.getElementById('mobileDrawer');
  const btn = document.getElementById('hamburgerBtn');
  if (drawer && btn && !drawer.contains(e.target) && !btn.contains(e.target)) {
    drawer.classList.remove('open');
  }
});

/* ========== SPA ROUTER (Shell) ==========
   navigate() — เปลี่ยน URL โดยไม่ reload
   router ตัวจริงอยู่ใน app.js (handleRoute)
   ฟังก์ชันนี้เป็น bridge ให้ inline onclick ใช้ได้ก่อน module โหลด */
function navigate(e, path) {
  if (e) e.preventDefault();
  if (typeof window.handleRoute === 'function') window.handleRoute(path);
  const drawer = document.getElementById('mobileDrawer');
  if (drawer) drawer.classList.remove('open');
}

/* รับ back/forward browser */
window.addEventListener('popstate', function() {
  if (typeof window.handleRoute === 'function') {
    window.handleRoute(location.pathname);
  }
});

/* ========== SLEEP TIMER STUBS ==========
   เรียก window.fn ที่ app.js (ES module) จะ assign ให้ภายหลัง
   ถ้า module ยังโหลดไม่เสร็จ ให้รอแล้วลองใหม่ */
function _callWhenReady(fn, args) {
  if (typeof window[fn] === 'function') { window[fn](...args); return; }
  setTimeout(() => { if (typeof window[fn] === 'function') window[fn](...args); }, 300);
}
function toggleSleepTimer()    { _callWhenReady('openSleepPopup', []); }
function closeSleepPopup()     { _callWhenReady('closeSleepPopup', []); }
function adjustSleepMins(d)    { _callWhenReady('adjustSleepMins', [d]); }
function setSleepMins(m)       { _callWhenReady('setSleepMins', [m]); }
</script>
<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('any').catch(() => {});
  }
</script>
