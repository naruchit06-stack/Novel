<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Golden Hoard Novels</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700;800&family=Chakra+Petch:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="mainNavbar">

  <!-- Logo ซ้าย -->
  <a class="nav-logo" href="/" onclick="navigate(event,'/')">
    <div class="nav-logo-icon">👑</div>
    <div class="nav-logo-text">The Golden <span>Hoard</span></div>
  </a>

  <!-- เมนูกลาง -->
  <div class="nav-links">
    <a href="/" id="nav-home-link" onclick="navigate(event,'/')">หน้าแรก</a>
    <a href="/library" id="nav-library-link" onclick="navigate(event,'/library')">นิยายทั้งหมด</a>
    <a href="#" id="nav-favorites-link">รายการโปรด</a>
  </div>

  <!-- Search box -->
  <div class="nav-search">
    <span class="nav-search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="ค้นหานิยาย..." oninput="filterNovels()">
  </div>

  <!-- Actions ขวา — แสดงเมื่อ logout -->
  <div class="nav-actions" id="navGuestActions">
    <a href="login.html" class="nav-btn nav-btn-outline" id="navLoginBtn">เข้าสู่ระบบ</a>
    <a href="login.html" class="nav-btn nav-btn-fill"    id="navRegisterBtn">สมัครสมาชิก</a>
  </div>

  <!-- User menu — แสดงเมื่อ login -->
  <div class="nav-user" id="navUserMenu" style="display:none;">
    <div class="nav-avatar" id="navAvatar">U</div>
    <div class="nav-dropdown">
      <a href="#" id="navUserName" style="cursor:default;pointer-events:none;color:var(--text);font-weight:700;">ผู้ใช้</a>
      <a href="#" id="navAdminBtn" style="display:none;" onclick="event.preventDefault();location.href=(window._BASE||'')+'/admin.html'">⚙️ จัดการนิยาย</a>
      <a href="#" class="danger" onclick="handleSignOut()">🚪 ออกจากระบบ</a>
    </div>
  </div>

  <!-- Hamburger (mobile) -->
  <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileNav()" aria-label="เมนู">☰</button>

</nav>

<!-- Mobile nav drawer -->
<div class="nav-mobile-drawer" id="mobileDrawer">
  <a href="/" onclick="navigate(event,'/')">🏠 หน้าแรก</a>
  <a href="/library" onclick="navigate(event,'/library')">📚 นิยายทั้งหมด</a>
  <a href="#" id="mobile-favorites-link">⭐ รายการโปรด</a>
  <div class="nav-mobile-search">
    <span>🔍</span>
    <input type="text" placeholder="ค้นหานิยาย..." oninput="filterNovels()">
  </div>
  <div class="nav-mobile-auth" id="mobileGuestAuth">
    <a href="login.html" class="nav-btn nav-btn-outline"><span>เข้าสู่ระบบ</span></a>
    <a href="login.html" class="nav-btn nav-btn-fill"><span>สมัครสมาชิก</span></a>
  </div>
</div>

<!-- ========== APP VIEW (SPA content area) ========== -->
<div id="app-view">
</div><!-- /#app-view -->

<!-- NOW PLAYING BAR (PLAYER-NEW-1) -->
<div class="now-playing" id="nowPlaying">

  <!-- Progress bar — drag ได้เหมือน YouTube -->
  <div class="np-progress-top" id="npBar">
    <div class="np-progress-top-fill" id="npBarFill"></div>
    <div class="np-progress-top-thumb" id="npBarThumb"></div>
  </div>

  <div class="np-main-row">
    <!-- ซ้าย: cover + info -->
    <div class="np-left">
      <div class="np-cover" id="npCover">🎧</div>
      <div class="np-info">
        <div class="np-title" id="npTitle">-</div>
        <div class="np-ep"    id="npEp">-</div>
      </div>
    </div>

    <!-- กลาง: controls ตามรูป -->
    <div class="np-center">
      <!-- ⏪ 10 วิ -->
      <button class="np-ctrl-btn" onclick="rewind10()" title="ย้อน 10 วิ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-5.05"/>
          <text x="8.5" y="14.5" font-size="5.5" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">10</text>
        </svg>
      </button>
      <!-- ⏮ ตอนก่อน -->
      <button class="np-ctrl-btn" onclick="prevEp()" title="ตอนก่อน">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="19,5 9,12 19,19"/><rect x="5" y="5" width="2.5" height="14" rx="1"/>
        </svg>
      </button>
      <!-- ▶/⏸ play -->
      <button class="np-ctrl-btn np-play" id="btnPlayPause" onclick="togglePlay()">
        <svg id="svgPlay" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
        <svg id="svgPause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/></svg>
      </button>
      <!-- ⏭ ตอนถัดไป -->
      <button class="np-ctrl-btn" onclick="nextEp()" title="ตอนถัดไป">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5,5 15,12 5,19"/><rect x="16.5" y="5" width="2.5" height="14" rx="1"/>
        </svg>
      </button>
      <!-- ⏩ 10 วิ -->
      <button class="np-ctrl-btn" onclick="forward10()" title="ข้าม 10 วิ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-.49-5.05"/>
          <text x="8.5" y="14.5" font-size="5.5" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">10</text>
        </svg>
      </button>
    </div>

    <!-- ขวา: time | speed | sleep | speed-indicator | volume -->
    <div class="np-right">
      <span class="np-time-text"><span id="npCurrent">0:00</span> / <span id="npDuration">0:00</span></span>
      <!-- 🕐 sleep timer -->
      <button class="np-icon-btn np-sleep" id="npSleepBtn" onclick="toggleSleepTimer()" title="ตั้งเวลาปิด">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" stroke-dasharray="3 2.5"/>
          <polyline points="12,7 12,12 15,15" stroke-dasharray="none"/>
        </svg>
      </button>
      <!-- 🔁 speed -->
      <button class="np-pill-btn" id="npSpeedBtn" onclick="cycleSpeed()" title="ความเร็ว">1.0x</button>
      <!-- 🔊 volume -->
      <button class="np-icon-btn" onclick="toggleMute()" id="npVolIcon" title="เสียง">
        <svg id="svgVolOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg id="svgVolOff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="currentColor" stroke="none"/>
          <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <input class="np-volume" id="npVolume" type="range" min="0" max="1" step="0.05" value="1" oninput="setVolume(this.value)">
    </div>
  </div>
</div>

<audio id="audioEl"></audio>
<script>
/* toggleMobileNav — เปิด/ปิด mobile drawer */
function toggleMobileNav() {
  document.getElementById('mobileDrawer').classList.toggle('open');
}
/* ปิด drawer เมื่อคลิกนอก */
document.addEventListener('click', function(e) {
  const drawer = document.getElementById('mobileDrawer');
  const btn = document.getElementById('hamburgerBtn');
  if (drawer && btn && !drawer.contains(e.target) && !btn.contains(e.target)) {
    drawer.classList.remove('open');
  }
});

/* ========== SPA ROUTER (Shell) ==========
   navigate() — เปลี่ยน URL โดยไม่ reload
   router ตัวจริงอยู่ใน app.js (handleRoute)
   ฟังก์ชันนี้เป็น bridge ให้ inline onclick ใช้ได้ก่อน module โหลด */
function navigate(e, path) {
  if (e) e.preventDefault();
  /* ไม่ pushState เอง — ให้ router.navigate() จัดการเพื่อไม่ให้ early-return */
  if (typeof window.handleRoute === 'function') window.handleRoute(path);
  /* ปิด mobile drawer เมื่อ navigate */
  const drawer = document.getElementById('mobileDrawer');
  if (drawer) drawer.classList.remove('open');
}

/* รับ back/forward browser */
window.addEventListener('popstate', function() {
  if (typeof window.handleRoute === 'function') {
    window.handleRoute(location.pathname);
  }
});
</script>
<script type="module" src="app.js"></script>
</body>
</html>
